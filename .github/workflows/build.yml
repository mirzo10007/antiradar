name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Bu obrazda Android SDK oldindan o'rnatilgan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Testlar
        run: ./gradlew :core:test
      - name: APK yig'ish
        run: |
          ./gradlew :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/antiradar.apk
      - uses: actions/upload-artifact@v4
        with:
          name: antiradar-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Telefon uchun yuklab olish havolasi (Release)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Antiradar (oxirgi versiya)
          prerelease: false
          make_latest: true
          files: app/build/outputs/apk/debug/antiradar.apk
